[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clippy-backend"
version = "0.1.0"
description = "Auto-clipping backend: finds attention-grabbing moments in long videos and renders vertical captioned clips."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "anthropic>=0.70",
    "faster-whisper>=1.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "yt-dlp>=2024.8.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
