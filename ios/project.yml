# XcodeGen spec. The GitHub Actions workflow runs `xcodegen generate` to create Clippy.xcodeproj.
name: Clippy
options:
  bundleIdPrefix: com.clippy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Clippy:
    type: application
    platform: iOS
    sources:
      - path: Clippy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clippy.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: Clippy/Info.plist
      properties:
        CFBundleDisplayName: Clippy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # The backend runs on your own computer over plain http on the home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Clippy connects to the Clippy backend running on your computer.
        NSPhotoLibraryUsageDescription: Pick long videos to turn into clips.
        NSPhotoLibraryAddUsageDescription: Save finished clips to your Photos so you can post them.
