# Builds an unsigned Clippy.ipa on a GitHub macOS machine (free for public repos).
# Download it from the run's "Artifacts" section and install it with Sideloadly or AltStore.
name: iOS IPA

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Clippy.xcodeproj \
            -scheme Clippy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          APP=ios/build/Build/Products/Release-iphoneos/Clippy.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Clippy.ipa Payload
          ls -lh Clippy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Clippy-ipa
          path: Clippy.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
